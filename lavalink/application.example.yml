server:
  port: 9001
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 10000
    frameBufferDurationMs: 10000
    youtubePlaylistLoadLimit: 20
    playerUpdateInterval: 3000
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: false
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    filters:
      volume: true
    koe:
      highPacketPriority: false
      byteBufAllocator: "pooled"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TV
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:your_youtube_oauth_refresh_token_here}"
  lavasrc:
    providers:
      - "scsearch:%QUERY%"
      - "scsearch:\"%ISRC%\""
      - "spsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:your_spotify_client_id_here}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:your_spotify_client_secret_here}"
      countryCode: "IN"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  file:
    max-history: 7
    max-size: 100MB
  path: ./logs/

  level:
    root: INFO
    lavalink: INFO
    com.github.topi314.lavasrc: DEBUG
